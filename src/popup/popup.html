<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DynamicsCat</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <img src="../icons/icon32.png" alt="DynamicsCat" class="header-icon" />
    <span class="header-title">DynamicsCat</span>
  </header>

  <main class="two-col">
    <section class="tool-group">
      <h2 class="tool-group-label">🛠 Tools</h2>
      <button id="btn-all-fields" class="tool-btn">
        <span class="btn-icon">📋</span>
        <span class="btn-label">All Fields</span>
      </button>
      <button id="btn-show-option-sets" class="tool-btn">
        <span class="btn-icon">🔘</span>
        <span class="btn-label">Show Option Sets</span>
      </button>
      <button id="btn-show-hidden-fields" class="tool-btn">
        <span class="btn-icon">👁</span>
        <span class="btn-label">Show Hidden Fields</span>
      </button>
      <button id="btn-dirty-fields" class="tool-btn">
        <span class="btn-icon">✏️</span>
        <span class="btn-label">Dirty Fields</span>
      </button>
      <div class="tool-with-settings">
        <div class="tool-inline-row">
          <button id="btn-override-readonly" class="tool-btn">
            <span class="btn-icon">🔓</span>
            <span class="btn-label">Override Readonly</span>
          </button>
          <button id="btn-readonly-settings" class="settings-gear" title="Shortcut settings" aria-label="Shortcut settings">⚙️</button>
        </div>
        <div id="readonly-settings-panel" class="settings-panel" hidden>
          <label for="readonly-shortcut-select">Shortcut:</label>
          <select id="readonly-shortcut-select" class="settings-select">
            <option value="alt+shift">Alt+Shift+Click</option>
            <option value="alt">Alt+Click</option>
            <option value="shift">Shift+Click</option>
            <option value="ctrl">Ctrl+Click</option>
            <option value="ctrl+shift">Ctrl+Shift+Click</option>
          </select>
        </div>
      </div>
      <div class="tool-with-settings">
        <div class="tool-inline-row">
          <button id="btn-lookups-opener" class="tool-btn">
            <span class="btn-icon">🪟</span>
            <span class="btn-label">Lookups Opener</span>
          </button>
          <button id="btn-lookups-opener-settings" class="settings-gear" title="Shortcut settings" aria-label="Shortcut settings">⚙️</button>
        </div>
        <div id="lookups-opener-settings-panel" class="settings-panel" hidden>
          <label for="lookups-opener-shortcut-select">Shortcut:</label>
          <select id="lookups-opener-shortcut-select" class="settings-select">
            <option value="alt+shift">Alt+Shift+Click</option>
            <option value="alt">Alt+Click</option>
            <option value="shift">Shift+Click</option>
            <option value="ctrl">Ctrl+Click</option>
            <option value="ctrl+shift">Ctrl+Shift+Click</option>
          </select>
        </div>
      </div>
    </section>
    <section class="tool-group tool-group-right">
      <h2 class="tool-group-label">🌐 API</h2>
      <button id="btn-open-on-api" class="tool-btn tool-btn-compact">
        <span class="btn-icon">🔗</span>
        <span class="btn-label">Open on API</span>
      </button>
      <button id="btn-jump-to-latest" class="tool-btn tool-btn-compact">
        <span class="btn-icon">🕐</span>
        <span class="btn-label">Jump to Latest</span>
      </button>
      <button id="btn-activate-activity" class="tool-btn tool-btn-compact conditional-btn" hidden>
        <span class="btn-icon">🔓</span>
        <span class="btn-label">Activate</span>
      </button>
    </section>
  </main>

  <script src="popup.js"></script>
</body>
</html>
